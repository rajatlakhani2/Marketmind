name: NSE feed probe

# Debug tool: fetches the NSE feeds events.php uses (with NSE's cookies, like events.php does)
# and prints the field names and a sample row, so parsers can be matched to NSE's real data.

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'NSE symbol'
        required: true
        default: 'TCS'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NSE
        env:
          SYM: ${{ github.event.inputs.symbol }}
        run: |
          python3 - <<'PY'
          import json, os, http.cookiejar, urllib.request
          sym = os.environ["SYM"]
          NSE = "https://www.nseindia.com"
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          def get(path, accept="application/json, text/plain, */*", ref="/"):
              req = urllib.request.Request(NSE + path, headers={"User-Agent": UA, "Accept": accept, "Accept-Language": "en-US,en;q=0.9", "Referer": NSE + ref})
              try:
                  with op.open(req, timeout=30) as r: return r.status, r.read().decode("utf-8", "replace")
              except Exception as e:
                  return getattr(e, "code", 0), str(e)
          print("home:", get("/", "text/html")[0])
          print("quote page:", get(f"/get-quotes/equity?symbol={sym}", "text/html")[0])
          def show(name, path, ref):
              s, b = get(path, ref=ref)
              print(f"\n===== {name}  HTTP {s}  ({len(b)} bytes)")
              try: j = json.loads(b)
              except Exception: print(b[:500]); return
              if isinstance(j, dict):
                  print("top-level keys:", list(j.keys()))
                  rows = next((v for v in j.values() if isinstance(v, list) and v and isinstance(v[0], dict)), None)
              else:
                  rows = j
              if rows:
                  print("rows:", len(rows)); print("row keys:", list(rows[0].keys()))
                  for r in rows[:3]: print(json.dumps(r, ensure_ascii=False)[:1500])
              else:
                  print(json.dumps(j)[:1500])
          show("results-comparision", f"/api/results-comparision?symbol={sym}", f"/get-quotes/equity?symbol={sym}")
          show("corporate actions (symbol)", f"/api/corporates-corporateActions?index=equities&symbol={sym}", "/companies-listing/corporate-filings-actions")
          show("corporate actions (all upcoming)", "/api/corporates-corporateActions?index=equities", "/companies-listing/corporate-filings-actions")
          s,b=get(f"/api/results-comparision?symbol={sym}", ref=f"/get-quotes/equity?symbol={sym}")
          try: print("\nresults periods:", [(r.get("re_from_dt"), r.get("re_to_dt"), r.get("re_res_type"), r.get("re_net_sale")) for r in json.loads(b)["resCmpData"]])
          except Exception as e: print("periods err", e)
          import datetime as dt
          t=dt.date.today(); f=t.strftime("%d-%m-%Y"); e=(t+dt.timedelta(days=90)).strftime("%d-%m-%Y")
          s,b=get(f"/api/corporates-corporateActions?index=equities&from_date={f}&to_date={e}", ref="/companies-listing/corporate-filings-actions")
          try: j=json.loads(b); print("actions with date range:", s, len(j), "last exDate:", j[-1]["exDate"] if j else None)
          except Exception as x: print("range err", s, b[:300])
          s,b=get(f"/api/corporates-financial-results?index=equities&symbol={sym}&period=Quarterly", ref="/companies-listing/corporate-filings-financial-results")
          print("\n===== financial-results filings HTTP", s, len(b))
          try:
              j=json.loads(b); rows=j if isinstance(j,list) else next(v for v in j.values() if isinstance(v,list))
              print("rows", len(rows), "keys", list(rows[0].keys()))
              for r in rows[:4]: print(json.dumps(r)[:700])
          except Exception as x: print(b[:400])
          import time
          now=int(time.time()); y=urllib.request.Request(f"https://query2.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/{sym}.NS?type=quarterlyTotalRevenue,quarterlyNetIncome,quarterlyDilutedEPS&period1={now-3*365*86400}&period2={now}", headers={"User-Agent":UA})
          try:
              yj=json.load(urllib.request.urlopen(y,timeout=30))
              for res in yj["timeseries"]["result"]:
                  t=res["meta"]["type"][0]; print("yahoo", t, [(v["asOfDate"], v["reportedValue"]["raw"]) for v in res.get(t) or [] if v])
          except Exception as x: print("yahoo err", x)
          show("event calendar", "/api/event-calendar", "/companies-listing/corporate-filings-event-calendar")
          PY
